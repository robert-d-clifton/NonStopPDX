# NonStopPDX, one Compose project: the Django site, PostgreSQL and the weekly sync.
# Settings come from .env (copy .env.example to start). The code folder is mounted
# into the containers, so code changes show up without a rebuild while developing.

name: nonstoppdx

x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nonstoppdx}
      POSTGRES_USER: ${POSTGRES_USER:-nonstoppdx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --reload
    ports:
      - "${WEB_BIND:-127.0.0.1:8000}:8000"

  scheduler:
    <<: *app
    command: python manage.py run_scheduler

  # Cloudflare Tunnel to nonstoppdx.com: dials out to Cloudflare and hands requests to web, so no router
  # ports open. Cloudflare Access in front of it decides who gets in. Started on its own with
  # `docker compose --profile tunnel up -d tunnel`; needs CLOUDFLARE_TUNNEL_TOKEN in .env.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

  # FAA SWIM trial: keeps airline flights to and from PDX in data/swim. Started on its own with
  # `docker compose --profile swim up -d swim`; needs the SWIM_* settings in .env.
  swim:
    build: swim
    profiles: [swim]
    env_file: .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data/swim_operators.json:/config/operators.json:ro
      - ./data/swim:/out
    restart: unless-stopped

volumes:
  pgdata:
