{% load static %}<section class="wrap map-section" id="map" aria-labelledby="map-title">
    <h2 id="map-title" class="visually-hidden">{{ map_title|default:"Map of nonstop routes from PDX" }}</h2>
    <div class="overview">
      <div class="map-frame">
        <svg class="overview-map" id="overview-map" viewBox="0 0 1000 640" role="img"
             aria-label="{{ map_label }}"></svg>
        <noscript><p class="map-fallback">The map needs JavaScript. Every destination is in the departures list below.</p></noscript>
      </div>
      <div class="side">
        {% if show_west %}
        <div class="maptabs" role="group" aria-label="Map zoom">
          <button type="button" id="zoom-world" data-zoom="world" aria-pressed="true">Everywhere</button>
          <button type="button" id="zoom-west" data-zoom="west" aria-pressed="false">The West, up close</button>
        </div>
        {% endif %}
        <div class="readout" aria-live="polite">
          <span class="eyebrow">Selected destination</span>
          <div class="codes"><div class="flaps" id="readout-code" aria-hidden="true"></div></div>
          <div class="name" id="readout-name">Tap a dot on the map</div>
          <div class="meta" id="readout-meta">Each one shows its distance, flight time and airlines here.</div>
          <a class="readout-link" id="readout-link" href="#" hidden></a>
        </div>
        <div class="legend">
          <div><svg width="44" height="10" aria-hidden="true"><line x1="2" y1="5" x2="42" y2="5" class="spoke"/></svg>Year round</div>
          <div><svg width="44" height="10" aria-hidden="true"><line x1="2" y1="5" x2="42" y2="5" class="spoke seasonal"/></svg>Seasonal or starting soon</div>
        </div>
      </div>
    </div>
  </section>
